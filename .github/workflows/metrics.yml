name: Metrics

# Regenerates the four metrics SVGs embedded in README.md: two columns, each in light and dark.
# Runs on GitHub's free hosted runner. Needs one repository secret: METRICS_TOKEN (see SETUP.md).
#
# Uses gh-metrics/metrics, the maintenance fork of lowlighter/metrics. Upstream has had no
# commit since Dec 2023 and its achievements plugin errors against today's GitHub API; the
# fork fixed that (Projects v2, Mar and Jun 2026), guards the habits/activity crashes, includes
# the private-repo languages fix, and publishes its own prebuilt image (ghcr.io/gh-metrics/metrics:master).
#
# Each column is rendered once (the languages step clones every repo and takes ~15 min). The dark
# variant is derived from the light SVG by injecting three CSS overrides, then all four files are
# committed together. The classic template has no theme option of its own.

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC (01:17 Ottawa in winter)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # ---------- Left column: calendar, languages, achievements ----------
      - name: Render left column
        uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: AlexjComeau
          template: classic
          filename: metrics-left-light.svg
          output_action: none
          base: ""
          config_timezone: America/Toronto
          config_display: regular
          config_order: isocalendar, languages, achievements
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 40
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, lines
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, scss, dockerfile, makefile, shell
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugins_errors_fatal: no

      # ---------- Right column: activity, habits, lines ----------
      - name: Render right column
        uses: gh-metrics/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: AlexjComeau
          template: classic
          filename: metrics-right-light.svg
          output_action: none
          base: activity, repositories
          config_timezone: America/Toronto
          config_display: regular
          config_order: base.activity+community, base.repositories, habits, lines
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_trim: yes
          plugin_lines: yes
          plugin_lines_sections: base
          plugins_errors_fatal: no

      # ---------- Dark variants + one commit ----------
      - name: Derive dark variants and commit
        shell: bash
        run: |
          set -euo pipefail
          echo "Renders:"; sudo ls -la /metrics_renders
          for side in left right; do
            sudo cp "/metrics_renders/metrics-${side}-light.svg" "metrics-${side}-light.svg"
            sudo chown "$USER" "metrics-${side}-light.svg"
          done
          python3 - <<'PY'
          dark = "svg{color:#c9d1d9!important}h1,h2{color:#58a6ff!important}.field svg{fill:#8b949e!important}"
          for side in ("left", "right"):
              s = open(f"metrics-{side}-light.svg").read()
              assert "</style>" in s, f"no <style> in metrics-{side}-light.svg"
              open(f"metrics-{side}-dark.svg", "w").write(s.replace("</style>", dark + "</style>", 1))
              print(f"metrics-{side}-dark.svg written")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics-left-light.svg metrics-left-dark.svg metrics-right-light.svg metrics-right-dark.svg
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: refresh metrics"
          git push
